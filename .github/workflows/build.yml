# Artifact build for this fork. Rebuild AoE's two ntdll modules from pinned Wine sources
# and package them with the checksum-verified Highball r32 engine.
name: build-engine
on:
  push:
    branches: ["build/aoe4-3f2bd4f"]
permissions:
  contents: read
jobs:
  build:
    # Intel runner on purpose: the Unix side of this tree is x86_64 only (the Mac driver's
    # Metal layer class in d3dmetal_objc.h sits behind #if defined(__x86_64__)), as in
    # CrossOver's and Sikarugir's own builds. It runs under Rosetta on Apple Silicon.
    runs-on: macos-15-intel
    timeout-minutes: 300
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    steps:
      - uses: actions/checkout@v4
      - name: AoE IV pinned source and tests
        run: |
          set -euo pipefail
          url=$(python3 -c 'import json; print(json.load(open("proposals/aoe4/inputs.lock.json"))["wine_source"]["url"])')
          curl --fail --location -o crossover-sources.tar.gz "$url"
          python3 proposals/aoe4/prepare-source.py crossover-sources.tar.gz src
          proposals/aoe4/tests/run.sh "$PWD/src/sources/wine"
          python3 proposals/aoe4/tests/test_tools.py
      - name: AoE IV combined arm64 helper
        run: |
          command -v cmake >/dev/null || brew install cmake
          proposals/aoe4/build-sidecar.sh "$RUNNER_TEMP/aoe4-helper-build"
      - name: toolchain
        run: |
          set -euo pipefail
          brew install -q mingw-w64 bison pkg-config ccache gnutls freetype sdl2 libpng jpeg-turbo gstreamer molten-vk || true
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          x86_64-w64-mingw32-gcc --version | head -1
          i686-w64-mingw32-gcc --version | head -1
      - name: ccache
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ccache
          key: ccache-${{ runner.os }}-${{ hashFiles('inputs.json', 'patches/**') }}-aoe4-${{ hashFiles('proposals/aoe4/patches/**') }}
          restore-keys: ccache-${{ runner.os }}-
      # The 32-bit PE side is built for SSE2 maths, as Windows' own DLLs are. GCC's i686 default is
      # the x87 unit, which Rosetta runs slowly, and every 32-bit game pays it in Wine's own audio
      # and Direct3D code: r27 to r29 had 1,615 x87 instructions and no SSE in dsound.dll, where
      # Sikarugir's Wine 10 build has 51 and 1,142 (counted 2026-11-03, highball-db#462, #926). The
      # Windows ABI only promises a 4-byte aligned stack on i386, so GCC realigns where it spills.
      # OpenGL is not passed explicitly: configure then treats the missing EGL headers
      # (there is no EGL on macOS) as a notice, and the Mac driver links OpenGL.framework.
      - name: Configure and rebuild the AoE ntdll modules
        run: |
          set -euo pipefail
          mkdir -p build && cd build
          ../src/sources/wine/configure \
            --prefix="$PWD/../out/engine" \
            --enable-archs=i386,x86_64 \
            --with-mingw \
            --without-alsa --without-capi --with-coreaudio --without-cups --without-dbus \
            --without-fontconfig --with-freetype --with-gnutls --without-gphoto --with-gstreamer \
            --without-krb5 --without-netapi --without-oss --without-pulse \
            --without-sane --with-sdl --without-udev --without-usb --without-v4l2 --without-x \
            --disable-tests \
            CC="ccache clang" CXX="ccache clang++" \
            CROSSCC="ccache x86_64-w64-mingw32-gcc" \
            i386_CC="ccache i686-w64-mingw32-gcc" x86_64_CC="ccache x86_64-w64-mingw32-gcc" \
            i386_CFLAGS="-g -O2 -msse2 -mfpmath=sse -mincoming-stack-boundary=2"
          make -j"$(sysctl -n hw.ncpu)" dlls/ntdll/ntdll.so dlls/ntdll/x86_64-windows/ntdll.dll
      - name: Stage checksum-verified Highball r32
        env:
          STOCK_WINE_URL: https://github.com/gauthierpiarrette/highball-engine/releases/download/engine-wine-11.0-20261112T101620Z-gst-rpath-0030/engine-wine-11.0-20261112T101620Z-gst-rpath-0030.tar.gz
          STOCK_WINE_SHA256: 94936e0dc184e9fba4e202f8ec165c5e8bbbfea1bbed43730ceaa14b8a3bbd46
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o stock-wine.tar.gz "$STOCK_WINE_URL"
          echo "$STOCK_WINE_SHA256  stock-wine.tar.gz" | shasum -a 256 -c -
          mkdir -p out
          tar -xzf stock-wine.tar.gz -C out
          test -x out/engine/bin/wine
          cp build/dlls/ntdll/ntdll.so out/engine/lib/wine/x86_64-unix/
          cp build/dlls/ntdll/x86_64-windows/ntdll.dll out/engine/lib/wine/x86_64-windows/
          if otool -L out/engine/lib/wine/x86_64-unix/ntdll.so | grep -E '^.+(/usr/local|/opt/homebrew)/'; then
            exit 1
          fi
          printf 'Source commit 2679c813ee28878d381d161ceaf9062bfcd6175b\nActions commit %s\nStock engine archive SHA256 %s\n'             "$GITHUB_SHA" "$STOCK_WINE_SHA256" > build-provenance.txt
      - name: AoE IV decoder notice
        run: cp proposals/aoe4/Licenses/HDE-LICENSE.txt out/engine/share/wine/
      - name: Engine archive
        env:
          BUILD_NOTE: aoe4-trial
        run: |
          set -euo pipefail
          name="engine-$(out/engine/bin/wine --version | tr ' ()' '-' | tr -s '-' | sed 's/-$//')-$(date -u +%Y%m%dT%H%M%SZ)-$BUILD_NOTE"
          tar -C out -czf "${name}.tar.gz" .
          shasum -a 256 "${name}.tar.gz" | tee "${name}.tar.gz.sha256"
          ls -la "${name}.tar.gz"
      - name: AoE IV helper archive and corresponding source
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/aoe4-package"
          mkdir -p "$work/aoe4/profiles" "$work/aoe4/Licenses" "$work/corresponding-source/proposals"
          cp "$RUNNER_TEMP/aoe4-helper-build/build/bin/x87sidecar" "$work/aoe4/"
          cp proposals/aoe4/profiles/*.cache "$work/aoe4/profiles/"
          cp proposals/aoe4/Licenses/x87sidecar-MIT.txt "$work/aoe4/Licenses/"
          cp proposals/aoe4/inputs.lock.json "$work/aoe4/"
          codesign --verify --strict "$work/aoe4/x87sidecar"
          tar -czf aoe4-helper.tar.gz -C "$work" aoe4
          shasum -a 256 aoe4-helper.tar.gz > aoe4-helper.tar.gz.sha256
          cp crossover-sources.tar.gz "$work/corresponding-source/"
          cp -R patches inputs.json LICENSE NOTICE.md "$work/corresponding-source/"
          cp -R proposals/aoe4 "$work/corresponding-source/proposals/"
          tar --exclude=.git --exclude=build -czf "$work/corresponding-source/sidecar-patched.tar.gz" -C "$RUNNER_TEMP/aoe4-helper-build/source" .
          tar -czf aoe4-corresponding-source.tar.gz -C "$work" corresponding-source
          shasum -a 256 aoe4-corresponding-source.tar.gz > aoe4-corresponding-source.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: engine
          path: |
            engine-*.tar.gz
            engine-*.tar.gz.sha256
            aoe4-helper.tar.gz*
            aoe4-corresponding-source.tar.gz*
            build-provenance.txt
          retention-days: 14
